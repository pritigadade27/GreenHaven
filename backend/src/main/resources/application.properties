#  Green Haven  —  Spring Boot configuration
#  ---------------------------------------------------------------------------
#  Before the first run, create the schema in MySQL:
#      CREATE DATABASE green_haven CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
#  then put your own MySQL password in spring.datasource.password below.

spring.application.name=green-haven

# ------------------------------------------------------------------ secrets
# Secrets live in backend/.env, which is gitignored. `optional:` means the app
# still starts without it — on a server you set real environment variables and
# delete the file. Nothing secret is committed either way.
spring.config.import=optional:file:./.env[.properties]

# ------------------------------------------------------------------- server
server.port=${PORT:8080}
server.servlet.context-path=/

# ----------------------------------------------------------------- database
# sessionVariables=time_zone is load-bearing, not decoration.
# serverTimezone only tells the DRIVER how to interpret values; it does not
# change what MySQL's own NOW()/CURRENT_TIMESTAMP returns. Without pinning
# the session zone, DB-generated columns (placed_at, created_at) were being
# written in the server's local zone while Java-written columns were UTC —
# so one row held two timestamps 5.5 hours apart for the same instant, and
# the idle-session check compared a future time against now.
# Host, port and database come from the environment so the same jar runs
# locally and on a managed MySQL. The query string is unchanged: pinning the
# session time zone is load-bearing (see the note above).
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:green_haven}?useSSL=${MYSQL_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&sessionVariables=time_zone%3D%27%2B00%3A00%27
spring.datasource.username=${MYSQL_USER:priti}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------------- JPA
# 'update' keeps the schema in step with the entities while we build.
# Switch to 'validate' once the model settles.
# schema.sql owns the schema; validate catches any entity drift at startup
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --------------------------------------------------------------------- JSON
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# ---------------------------------------------------------------------- JWT
# Supplied by backend/.env or a real environment variable. There is no default
# on purpose: a shipped default secret is a shipped master key.
greenhaven.jwt.secret=${GREENHAVEN_JWT_SECRET}
greenhaven.jwt.expiration-ms=86400000

# -------------------------------------------------------------------- files
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ------------------------------------------------------------------ logging
# INFO by default; run with --spring.profiles.active=dev for SQL and DEBUG.
logging.level.com.greenhaven=INFO
logging.level.org.hibernate.SQL=WARN

# ---------------------------------------------------------------- Razorpay
#  Test keys from https://dashboard.razorpay.com/app/keys — the key_secret is
#  used ONLY on the server, to create orders and to verify the signature that
#  comes back from the browser. It must never be sent to the client.
#  Override with env vars in anything other than local development.
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
#  live | simulated. "simulated" lets checkout run end to end with no gateway
#  account: the server signs its own stand-in response and then verifies it
#  through the ordinary path. It is ignored the moment an rzp_live_ key is set.
razorpay.mode=${RAZORPAY_MODE:live}
#  Blank means a fresh secret per boot, so no simulated signature survives a
#  restart. Only ever used in simulated mode.
razorpay.simulation-secret=${RAZORPAY_SIMULATION_SECRET:}
#  Razorpay dashboard > Settings > Webhooks. A DIFFERENT secret from the API
#  key: it signs the webhook body. Until it is set, /api/webhooks/razorpay
#  refuses every call rather than trusting an unsigned one.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# --------------------------------------------------------- password reset
greenhaven.auth.reset-minutes=${RESET_MINUTES:60}
#  DANGEROUS outside development. When true the reset token is returned in the
#  API response, which lets anyone who can call the endpoint take any account.
#  It exists only because no mail server is connected yet; with one, the token
#  goes in the email and this stays false. When false the token is logged.
greenhaven.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}

# ----------------------------------------------------------------- uploads
#  Product photographs, on local disk beside the jar. Relative so a deploy can
#  mount a volume at the same path; absolute if you would rather pin it.
greenhaven.uploads.dir=${UPLOADS_DIR:uploads}
greenhaven.uploads.public-path=/uploads

# A review photograph is uploaded as soon as it is chosen, so an abandoned
# review form leaves a file nothing points at. Swept hourly, but only once the
# file is old enough that no form could still be open on it.
greenhaven.uploads.sweep-orphans=${SWEEP_ORPHAN_UPLOADS:true}
greenhaven.uploads.orphan-grace-hours=${ORPHAN_GRACE_HOURS:24}

# --------------------------------------------------------------------- tax
#  GST as a whole percentage of the subtotal, charged on goods and not on
#  delivery. 0 is a real answer: live plants are GST-exempt in India. At 0 the
#  invoice is headed INVOICE rather than TAX INVOICE.
greenhaven.tax.gst-percent=${GST_PERCENT:0}

# ------------------------------------------------------------ reconciliation
#  A captured payment whose browser callback never arrived leaves an order
#  stranded at PENDING. This sweep asks Razorpay what really happened.
greenhaven.reconcile.enabled=${RECONCILE_ENABLED:true}
greenhaven.reconcile.after-minutes=${RECONCILE_AFTER_MINUTES:30}
greenhaven.reconcile.abandon-after-hours=${RECONCILE_ABANDON_AFTER_HOURS:24}

# --------------------------------------------------------------------- CORS
# Extra origins allowed to call the API, comma separated. The Vite dev ports are
# always allowed in code; this is where a deployed frontend's domain goes.
greenhaven.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ------------------------------------------------------------- rate limiting
# Per-IP caps. Sign-in is the one worth guarding hardest: without a cap, a
# password is only as strong as an attacker's patience.
greenhaven.ratelimit.login-per-15min=8
greenhaven.ratelimit.register-per-hour=5
greenhaven.ratelimit.forms-per-hour=10
greenhaven.ratelimit.checkout-per-hour=30
# Quoting a code reveals whether it exists, so this doubles as the brute-force
# guard on the discount codes themselves.
greenhaven.ratelimit.coupon-per-15min=15
# Comma-separated peer addresses whose X-Forwarded-For may be believed. Empty
# means the server is directly exposed and the header is ignored entirely —
# trusting it unconditionally would let any caller mint a fresh rate-limit
# bucket per request and defeat the limiter completely.
greenhaven.ratelimit.trusted-proxies=

# ----------------------------------------------------------- connections
# Checkout makes an outbound call to Razorpay. With the default pool of 10, a
# handful of slow payment calls could hold every connection and take the whole
# API down — including the public catalogue. A larger pool plus a short wait
# means a slow gateway degrades checkout only.
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=20000

# ------------------------------------------------------------- responses
# gzip on: catalogue payloads are ~65 KB of highly compressible JSON.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Pretty-printing inflated every production response by about a quarter for
# nobody's benefit. The dev profile turns it back on.
spring.jackson.serialization.indent-output=false

# Never let an exception message or a stack trace reach a client.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ------------------------------------------------------------------- admin
# The first admin account, created at startup if it does not already exist.
# Credentials come from backend/.env or the environment — never from the code,
# and never from the frontend. Leave the password blank to skip seeding.
greenhaven.admin.email=${ADMIN_EMAIL:}
greenhaven.admin.password=${ADMIN_PASSWORD:}
greenhaven.admin.name=${ADMIN_NAME:Green Haven Admin}

# --------------------------------------------------------- admin sessions
# An admin token is short-lived by design: it can read every order and every
# customer record in the shop, so it should not outlive a working session.
greenhaven.admin.session-minutes=${ADMIN_SESSION_MINUTES:60}
# Sliding inactivity window. A session idle for longer than this is revoked and
# the admin has to sign in again, even if the token itself has not expired.
greenhaven.admin.idle-minutes=${ADMIN_IDLE_MINUTES:20}
# One active session per admin. Signing in elsewhere revokes the previous one,
# so a forgotten session on a shared machine cannot be resumed.
greenhaven.admin.single-session=${ADMIN_SINGLE_SESSION:true}
