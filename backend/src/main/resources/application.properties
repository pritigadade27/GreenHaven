spring.application.name=green-haven

spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:8080}
server.servlet.context-path=/

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:green_haven}?useSSL=${MYSQL_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&sessionVariables=time_zone%3D%27%2B00%3A00%27
spring.datasource.username=${MYSQL_USER:priti}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

greenhaven.jwt.secret=${GREENHAVEN_JWT_SECRET}
greenhaven.jwt.expiration-ms=86400000

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.com.greenhaven=INFO
logging.level.org.hibernate.SQL=WARN

razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=INR
razorpay.mode=${RAZORPAY_MODE:live}
razorpay.simulation-secret=${RAZORPAY_SIMULATION_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

greenhaven.auth.reset-minutes=${RESET_MINUTES:60}
greenhaven.auth.expose-reset-token=${EXPOSE_RESET_TOKEN:false}

greenhaven.uploads.dir=${UPLOADS_DIR:uploads}
greenhaven.uploads.public-path=/uploads

greenhaven.uploads.sweep-orphans=${SWEEP_ORPHAN_UPLOADS:true}
greenhaven.uploads.orphan-grace-hours=${ORPHAN_GRACE_HOURS:24}

greenhaven.tax.gst-percent=${GST_PERCENT:0}

greenhaven.reconcile.enabled=${RECONCILE_ENABLED:true}
greenhaven.reconcile.after-minutes=${RECONCILE_AFTER_MINUTES:30}
greenhaven.reconcile.abandon-after-hours=${RECONCILE_ABANDON_AFTER_HOURS:24}

greenhaven.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

greenhaven.ratelimit.login-per-15min=8
greenhaven.ratelimit.register-per-hour=5
greenhaven.ratelimit.forms-per-hour=10
greenhaven.ratelimit.checkout-per-hour=30
greenhaven.ratelimit.coupon-per-15min=15
greenhaven.ratelimit.trusted-proxies=

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:25}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:200}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=20000

server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

spring.jackson.serialization.indent-output=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

greenhaven.admin.email=${ADMIN_EMAIL:}
greenhaven.admin.password=${ADMIN_PASSWORD:}
greenhaven.admin.name=${ADMIN_NAME:Green Haven Admin}

greenhaven.admin.session-minutes=${ADMIN_SESSION_MINUTES:60}
greenhaven.admin.idle-minutes=${ADMIN_IDLE_MINUTES:20}
greenhaven.admin.single-session=${ADMIN_SINGLE_SESSION:true}
